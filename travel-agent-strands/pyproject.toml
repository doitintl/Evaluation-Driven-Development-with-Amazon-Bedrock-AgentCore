[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-agent-strands"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents[otel]>=0.1.0",
    "aws-opentelemetry-distro~=0.12.1",
    "python-dotenv",
    "boto3",
    "bedrock-agentcore",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
