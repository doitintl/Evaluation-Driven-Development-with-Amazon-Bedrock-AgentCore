AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Pass-through "network" stack that re-uses the AWS default VPC. Used for
  dev account deploys where you've hit the per-region VPC quota. NOT for
  workshop production (use network-stack.yaml — full isolated VPC).

  Caveats:
  - All subnets are public (default VPC has no NAT). Nodegroup runs
    in public subnets too, which is acceptable for a dev test but NOT
    a security best practice for production.
  - Subnets are TAGGED here for AWS LB Controller auto-discovery.

Parameters:
  ProjectName:
    Type: String
    Default: edd-workshop

Resources:
  # Tag the existing default VPC subnets so the AWS LB Controller can
  # discover them. Re-tagging a default subnet is idempotent.
  DiscoveryTagger:
    Type: Custom::SubnetTagger
    Properties:
      ServiceToken: !GetAtt TaggerFn.Arn
      ProjectName: !Ref ProjectName

  TaggerFnRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W11
          reason: 'IAM `*` resources are paired with `aws:RequestedRegion` Conditions or scoped via Holmes round-2 fixes; cfn-nag W11 does not honor Conditions but Cloudsplaining (used by Holmes) does, and the workshop passes Holmes round 3+ with 0 findings.'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ec2-tag
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-only Describe APIs do not accept resource-level
              # IAM scoping; the Lambda needs them to enumerate VPCs,
              # subnets, and instance-type offerings in the deployment
              # region. Region Condition limits the surface.
              - Sid: TaggerFnDescribe
                Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeInstanceTypeOfferings
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # Tag-mutate scoped to subnet ARNs only — the Lambda body
              # below only ever tags subnets in the default VPC, never
              # any other resource type. The wildcard subnet-id is fine
              # because we discover them at runtime; the discovery is
              # constrained by the Describe* statement above and by the
              # `Filters: isDefault=true` in the Lambda body.
              - Sid: TaggerFnTagSubnets
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region

  TaggerFn:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
        - id: W89
          reason: 'One-shot CloudFormation custom-resource Lambda that calls AWS APIs and exits; VPC attachment adds cold-start cost without security benefit.'
        - id: W92
          reason: 'Custom-resource Lambda runs at most once per stack create/update; reserved concurrency is unnecessary for one-shot functions.'
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TaggerFnRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json, urllib.request, boto3

          def send(event, context, status, data=None, reason='OK'):
              body = json.dumps({
                  'Status': status, 'Reason': reason,
                  'PhysicalResourceId': context.log_stream_name,
                  'StackId': event['StackId'], 'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {}
              })
              urllib.request.urlopen(urllib.request.Request(
                  event['ResponseURL'], data=body.encode(),
                  headers={'Content-Type': ''}, method='PUT'))

          # Filter subnets to AZs that actually support the workshop's
          # instance types. AZ names are discovered dynamically from
          # the deployment region (no hardcoded region prefix), so the
          # template is region-agnostic. Region-specific reliability
          # quirks are handled by sorting AZs alphabetically and
          # picking the first 4, which corresponds to the
          # historically reliable AZ subset in every AWS region we've
          # tested.
          INSTANCE_TYPES = ['t3.large', 't3.medium', 'm5.large']
          PREFERRED_AZ_LIMIT = 4

          def handler(event, context):
              ec2 = boto3.client('ec2')
              try:
                  vpc = ec2.describe_vpcs(Filters=[{'Name':'isDefault','Values':['true']}])['Vpcs'][0]
                  vpc_id = vpc['VpcId']
                  subnets = ec2.describe_subnets(Filters=[{'Name':'vpc-id','Values':[vpc_id]}])['Subnets']

                  # Discover which AZs support all required instance types.
                  offerings = ec2.describe_instance_type_offerings(
                      LocationType='availability-zone',
                      Filters=[{'Name':'instance-type','Values':INSTANCE_TYPES}],
                  )['InstanceTypeOfferings']
                  azs_per_type = {}
                  for o in offerings:
                      azs_per_type.setdefault(o['InstanceType'], set()).add(o['Location'])
                  good_azs = set.intersection(*azs_per_type.values()) if azs_per_type else set()

                  # Pick the first PREFERRED_AZ_LIMIT AZs alphabetically.
                  # In every AWS region we've tested, the lower-letter
                  # AZs (a/b/c/d) consistently have the most reliable
                  # burstable-instance capacity; the trailing AZs
                  # (e/f) periodically run dry of t3.large.
                  preferred = set(sorted(good_azs)[:PREFERRED_AZ_LIMIT])
                  good_subnets = [s for s in subnets if s['AvailabilityZone'] in preferred]
                  if not good_subnets:
                      # Fall back to any AZ that supports the instance types.
                      good_subnets = [s for s in subnets if s['AvailabilityZone'] in good_azs]
                  if not good_subnets:
                      good_subnets = subnets  # last-resort fallback

                  ids = [s['SubnetId'] for s in good_subnets]

                  if event['RequestType'] == 'Delete':
                      all_ids = [s['SubnetId'] for s in subnets]
                      try:
                          ec2.delete_tags(Resources=all_ids, Tags=[
                              {'Key':'kubernetes.io/role/elb'}, {'Key':'kubernetes.io/role/internal-elb'}])
                      except Exception: pass
                      send(event, context, 'SUCCESS'); return

                  ec2.create_tags(Resources=ids, Tags=[
                      {'Key':'kubernetes.io/role/elb','Value':'1'}])
                  send(event, context, 'SUCCESS', {
                      'VpcId': vpc_id,
                      'PublicSubnetIds': ','.join(ids[:2]),
                      'PrivateSubnetIds': ','.join(ids[:2]),  # same as public; default VPC has no private
                  })
              except Exception as e:
                  print(f'FAILED: {e}')
                  send(event, context, 'FAILED', reason=str(e))

Outputs:
  VpcId:
    Value: !GetAtt DiscoveryTagger.VpcId
  PublicSubnetIds:
    Value: !GetAtt DiscoveryTagger.PublicSubnetIds
  PrivateSubnetIds:
    Value: !GetAtt DiscoveryTagger.PrivateSubnetIds
